name: Build signed installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and verify
        required: true
        default: both
        type: choice
        options: [both, mac, windows]
permissions:
  contents: read
jobs:
  mac:
    if: inputs.platform == 'both' || inputs.platform == 'mac'
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Require signing and notarization credentials
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac -- -c.mac.forceCodeSigning=true -c.dmg.sign=true
        env:
          REPO_RUN_SUPABASE_URL: ${{ vars.REPO_RUN_SUPABASE_URL }}
          REPO_RUN_SUPABASE_ANON_KEY: ${{ vars.REPO_RUN_SUPABASE_ANON_KEY }}
      - name: Verify signed apps and notarize installer images
        shell: bash
        run: |
          set -euo pipefail
          for app in 'release/mac/Repo Run.app' 'release/mac-arm64/Repo Run.app'; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with: { name: Repo-Run-mac-installers, path: 'release/*.*', retention-days: 14 }
  windows:
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Missing WIN_CSC_LINK. Configure Windows signing before building a signed release.'
          }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- -c.win.forceCodeSigning=true
        env:
          REPO_RUN_SUPABASE_URL: ${{ vars.REPO_RUN_SUPABASE_URL }}
          REPO_RUN_SUPABASE_ANON_KEY: ${{ vars.REPO_RUN_SUPABASE_ANON_KEY }}
      - name: Verify Windows installer and app signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'release/Repo-Run-*-win-x64.exe',
            'release/Repo-Run-*-win-arm64.exe',
            'release/win-unpacked/Repo Run.exe',
            'release/win-arm64-unpacked/Repo Run.exe'
          )
          foreach ($pattern in $files) {
            $matches = @(Get-Item -Path $pattern -ErrorAction Stop)
            if ($matches.Count -ne 1) { throw "Expected one artifact matching $pattern" }
            $signature = Get-AuthenticodeSignature -FilePath $matches[0].FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature on $($matches[0].Name): $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing signature timestamp on $($matches[0].Name)"
            }
            Write-Host "Verified $($matches[0].Name): $($signature.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with: { name: Repo-Run-windows-installers, path: 'release/*.exe', retention-days: 14 }
